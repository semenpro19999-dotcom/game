<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KS3 — Tactical Shooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="description" content="KS3 — духовный наследник CS2 с динамической погодой, разрушаемостью и честными кейсами">
</head>
<body>
  <div id="app">
    <!-- Three.js background -->
    <canvas id="bg-canvas"></canvas>
    <div id="bg-overlay"></div>
    
    <!-- App container -->
    <div id="ui-root"></div>
    
    <!-- HUD overlay (for in-game) -->
    <div id="hud-root" class="hidden"></div>
    
    <!-- Loading -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="logo">KS3</div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <div class="loading-text">Инициализация Lumen... Загрузка de_dustline...</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>

</html>
